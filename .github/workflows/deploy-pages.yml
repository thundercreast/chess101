name: Deploy Nightshift Chess to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate application markup and scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              "tutorModeBtn", "gameModeBtn", "board", "newGame", "undo",
              "hint", "flip", "color", "pace", "moveMode", "opponentRating",
              "resignMe", "offerComputerResign", "moves", "savedGameSelect",
              "openSavedGame", "deleteSavedGame", "replayStart", "replayBack",
              "replayForward", "replayEnd", "replaySlider", "continueFromHere",
              "userAnalysis", "computerPlan", "questionArea", "positionScan",
              "gameModePanel", "postGameAnalysis", "promotionOptions"
          ]
          missing = [key for key in required if f'id="{key}"' not in html]
          if missing:
              raise SystemExit("Missing required V4 elements: " + ", ".join(missing))
          if "data-mobile-tab" not in html or "pieceSvg(code)" not in html:
              raise SystemExit("Responsive navigation or custom SVG piece renderer is missing.")

          scripts = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.I)
          inline_scripts = [(attrs, body) for attrs, body in scripts if not re.search(r'\bsrc\s*=', attrs, re.I)]
          if not inline_scripts:
              raise SystemExit("No inline application scripts found.")
          for index, (_, script) in enumerate(inline_scripts):
              path = Path(tempfile.gettempdir()) / f"nightshift-inline-{index}.js"
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Validated {len(required)} required V4 elements and {len(inline_scripts)} inline scripts.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
